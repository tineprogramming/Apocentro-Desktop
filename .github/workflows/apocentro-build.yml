name: Apocentro Build

# Builds unsigned Apocentro desktop installers and uploads them as workflow
# artifacts. No code signing, notarization, or publishing is done here — this
# just produces runnable binaries you can download from the run's "Artifacts".
#
# - Linux:   AppImage (run directly, no install) + .deb
# - Windows: NSIS installer (.exe)
# - macOS:   .dmg (unsigned, best-effort — may need certs; continue-on-error)
#
# Two builds per change, at the two moments that matter:
#
# - pull_request: so a change is known to compile before it's merged. We
#   previously built only on push to apocentro-desktop, which meant a PR
#   could sit for days having never been compiled anywhere, and a broken
#   build only surfaced once it had already landed.
# - push to apocentro-desktop: the real, shipped build — the one that also
#   bumps the version and publishes a versioned Release with installers.
#
# Working branches are deliberately not built on push: with pull_request
# covering them, that would be a third build of the same commits. Use
# "Run workflow" (workflow_dispatch) to build a branch that has no PR yet.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - apocentro-desktop

concurrency:
  group: apocentro-build-${{ github.ref }}
  cancel-in-progress: true

# Needed by the version-bump commit and the versioned Release, both below.
permissions:
  contents: write

jobs:
  # package.json's version has never been bumped since the fork (still
  # 1.18.1), and installers are only ever uploaded as run artifacts, so
  # there's no persistent version history anywhere. On push to
  # apocentro-desktop (i.e. merged PRs) this bumps the patch version and
  # pushes it back, so the platform jobs below build with — and the release
  # job at the end tags/publishes — an ever-increasing version. Left alone
  # on the other working branch.
  version:
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/apocentro-desktop'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: needed to diff against the previous release
          # tag for changelogs, and to check whether a version already has
          # a release.
          fetch-depth: 0
          fetch-tags: true

      - name: Bump package.json patch version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")

          # First run of this workflow: the version currently shipping
          # (e.g. v1.18.1) has never had a release of its own — back it into
          # the Releases tab (notes only, no installers) so history doesn't
          # start empty at whatever version we bump to next.
          #
          # This also covers a rarer case: a previous run bumped to $CURRENT
          # and pushed, then got cancelled (by a fast-following push sharing
          # this workflow's concurrency group) before the release job could
          # publish it — so $CURRENT never got its real, installers-attached
          # release. Target the actual "bump to $CURRENT" commit (not
          # $GITHUB_SHA, which by now may be several commits ahead) so this
          # backfill's changelog boundary is correct and the next version's
          # changelog isn't shifted by commits this one already covers.
          OLD_TAG="v$CURRENT"
          if ! gh release view "$OLD_TAG" >/dev/null 2>&1; then
            echo "Backfilling a release for $OLD_TAG (no release found for it yet)"
            BACKFILL_TARGET=$(git log --fixed-strings --grep="chore: bump version to $CURRENT" --format=%H -1)
            BACKFILL_TARGET="${BACKFILL_TARGET:-$GITHUB_SHA}"
            PREV_TAG=$(git tag --list 'v*' | sort -V | tail -1)
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log "$PREV_TAG".."$BACKFILL_TARGET" --pretty='- %s (%h)' --no-merges)
            else
              CHANGELOG=$(git log "$BACKFILL_TARGET" --pretty='- %s (%h)' --no-merges -n 30)
            fi
            [ -z "$CHANGELOG" ] && CHANGELOG="- No recorded changes."
            NOTES=$(printf 'Backfilled release (commit %s) — either this predates automated versioning, or an earlier CI run for it was superseded before it could publish. No installers attached here — see the next version'"'"'s release for a current build.\n\n## Changes\n%s' "$BACKFILL_TARGET" "$CHANGELOG")
            gh release create "$OLD_TAG" \
              --target "$BACKFILL_TARGET" \
              --title "Apocentro Desktop $OLD_TAG" \
              --notes "$NOTES" \
              --prerelease
          fi

          NEW=$(awk -F. '{ $NF += 1; print }' OFS=. <<< "$CURRENT")
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $NEW [skip ci]"
          git push origin HEAD:apocentro-desktop
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Run whether `version` ran (apocentro-desktop) or was skipped (the
    # other working branch) — only a real failure should block this.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        electron_target: [AppImage, deb]
    name: "linux ${{ matrix.electron_target }}"
    env:
      USE_HARD_LINKS: false # https://github.com/electron-userland/electron-builder/issues/7093
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without this, checkout defaults to the commit that triggered the
          # run — which predates the version-bump commit `version` just
          # pushed. Follow that commit when it ran, otherwise (the other
          # working branch, where `version` is skipped) fall back to normal.
          ref: ${{ needs.version.outputs.sha || github.sha }}
          submodules: recursive

      - name: Setup
        uses: ./actions/setup
        with:
          cache_suffix: linux_x64

      - name: Enforce static builds for libsession-util-nodejs
        uses: ./actions/enforce_static_builds

      - name: Build
        run: pnpm run build

      - name: Make unsigned release build (${{ matrix.electron_target }})
        run: |
          sed -i 's/"target": "deb"/"target": "${{ matrix.electron_target }}"/g' package.json
          pnpm run build-release

      - name: Upload installer
        uses: ./actions/upload_prod_artefacts
        with:
          upload_prefix: linux-${{ matrix.electron_target }}

  windows:
    needs: version
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 40
    name: "windows x64"
    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.eol lf

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without this, checkout defaults to the commit that triggered the
          # run — which predates the version-bump commit `version` just
          # pushed. Follow that commit when it ran, otherwise (the other
          # working branch, where `version` is skipped) fall back to normal.
          ref: ${{ needs.version.outputs.sha || github.sha }}
          submodules: recursive

      - name: Setup
        uses: ./actions/setup
        with:
          cache_suffix: windows_x64

      - name: Build
        run: pnpm run build

      - name: Make unsigned release build
        run: pnpm run build-release

      - name: Upload installer
        uses: ./actions/upload_prod_artefacts
        with:
          upload_prefix: windows-x64

  mac:
    needs: version
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Native runner per architecture — electron-builder targets the host
        # arch, so no cross-compiling of native modules (libsession-util etc.).
        # macos-15-intel is GitHub's Intel runner label (macos-13 was retired).
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    name: "mac ${{ matrix.arch }} (unsigned)"
    # Unsigned mac builds can fail depending on the signing/notarize hooks, so
    # don't let it block the Linux/Windows artifacts.
    continue-on-error: true
    steps:
      - run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without this, checkout defaults to the commit that triggered the
          # run — which predates the version-bump commit `version` just
          # pushed. Follow that commit when it ran, otherwise (the other
          # working branch, where `version` is skipped) fall back to normal.
          ref: ${{ needs.version.outputs.sha || github.sha }}
          submodules: recursive

      - name: Setup
        uses: ./actions/setup
        with:
          cache_suffix: mac-${{ matrix.arch }}

      - name: Enforce static builds for libsession-util-nodejs
        uses: ./actions/enforce_static_builds

      - name: Build
        run: pnpm run build

      - name: Make unsigned release build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # don't try to sign
        run: pnpm run build-release

      - name: Upload installer
        uses: ./actions/upload_prod_artefacts
        with:
          upload_prefix: mac-${{ matrix.arch }}

  # Only on apocentro-desktop: gather every installer built above and
  # publish them as a permanent, never-deleted GitHub Release — this is
  # what actually builds up a version history in the Releases tab, instead
  # of installers only ever living as expiring run artifacts.
  release:
    needs: [linux, windows, mac, version]
    if: github.ref == 'refs/heads/apocentro-desktop'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="v${{ needs.version.outputs.version }}"
          FILES=$(find dist-artifacts -type f \( -iname '*.dmg' -o -iname '*.exe' -o -iname '*.deb' -o -iname '*.AppImage' \))
          if [ -z "$FILES" ]; then
            echo "No installer files found among downloaded artifacts, nothing to release." >&2
            exit 1
          fi

          # Pick up the backfilled tag (created earlier in this same run by
          # the version job) before diffing for the changelog.
          git fetch origin --tags --force
          PREV_TAG=$(git tag --list 'v*' | grep -v "^${VERSION}\$" | sort -V | tail -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty='- %s (%h)' --no-merges | grep -v '^- chore: bump version' || true)
          else
            CHANGELOG=$(git log --pretty='- %s (%h)' --no-merges -n 30 | grep -v '^- chore: bump version' || true)
          fi
          [ -z "$CHANGELOG" ] && CHANGELOG="- No user-facing changes recorded."
          NOTES=$(printf 'Automated unsigned build of commit %s.\n\n## Changes since %s\n%s' "$GITHUB_SHA" "${PREV_TAG:-the beginning}" "$CHANGELOG")

          echo "Publishing $VERSION with:"
          echo "$FILES"
          gh release create "$VERSION" $FILES \
            --target apocentro-desktop \
            --title "Apocentro Desktop $VERSION" \
            --notes "$NOTES" \
            --prerelease
